; Dark Awake key layout for OpenParrotInput: <virtual key> <byte> <mask>
; Arrow keys: up, down, left, right
0x26 1 0x01
0x28 1 0x04
0x25 1 0x10
0x27 1 0x40
; Z X C V: buttons 1-4
0x5A 2 0x40
0x58 2 0x01
0x43 2 0x04
0x56 2 0x10
; Return: P1 start
0x0D 0 0x10
; T: test, Y and U: test or service
0x54 0 0x40
0x59 0 0x08
0x55 0 0x04
; Gamepad: d-pad or left stick moves, buttons 1-4 are A B X Y on an Xbox layout,
; button 8 is Start
pad up 1 0x01
pad down 1 0x04
pad left 1 0x10
pad right 1 0x40
pad 1 2 0x40
pad 2 2 0x01
pad 3 2 0x04
pad 4 2 0x10
pad 8 0 0x10
