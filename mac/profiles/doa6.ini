; Dead or Alive 6 layout for OpenParrotInput. APM3 inputs use one byte each, so the mask
; only has to be non-zero. Inputs 0 and 15 close the game and are left unbound.
; Arrow keys: 2 up, 3 down, 4 left, 5 right. Return: 6 start.
0x26 2 0x01
0x28 3 0x01
0x25 4 0x01
0x27 5 0x01
0x0D 6 0x01
; Z X C V: 12 A, 8 B, 11 X, 7 Y
0x5A 12 0x01
0x58 8 0x01
0x43 11 0x01
0x56 7 0x01
; A S: 13 LB, 9 RB. D F: 10 and 14, probably the triggers.
0x41 13 0x01
0x53 9 0x01
0x44 10 0x01
0x46 14 0x01
; 1: input 1, purpose unknown
0x31 1 0x01
; Gamepad, Xbox layout
pad up 2 0x01
pad down 3 0x01
pad left 4 0x01
pad right 5 0x01
pad 8 6 0x01
pad 1 12 0x01
pad 2 8 0x01
pad 3 11 0x01
pad 4 7 0x01
pad 5 13 0x01
pad 6 9 0x01
